name: Deploy to Production

# Desactivado a propósito: mientras este repo es la base LCS (sin secrets ni
# cluster real configurados todavía), el trigger queda en manual para que
# nada se publique/despliegue solo con un push. Cuando el proyecto esté listo
# para desplegar de verdad (secrets creados, ver docs/CONFIGURAR_SECRETS.md),
# reemplazar por:
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # necesario para push de imagen a ghcr.io

# Si llegan varios push a main seguidos, cancela el deploy en curso y corre solo
# el último — evita apilar builds completos y migraciones encoladas.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Solo corre si el push fue directo a main (doble guardia contra triggers inesperados)
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      image-name:              "ghcr.io/gabngs/lcs"
      k8s-deployment:          "lcs-laravel-prod"
      k8s-deployment-queue:    "lcs-queue-prod"
      k8s-deployment-scheduler: "lcs-scheduler-prod"
      k8s-namespace:           "lcs-prod"
      docker-file:             "Dockerfile"
    secrets:
      kubeconfig:          ${{ secrets.KUBECONFIG_PROD }}
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
      discord_username:    ${{ secrets.DISCORD_USERNAME }}
