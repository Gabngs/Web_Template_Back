name: Reusable Deployment

on:
  workflow_call:
    inputs:
      image-name:
        description: "Nombre completo de la imagen (ej: ghcr.io/gabngs/lcs)"
        required: true
        type: string
      k8s-deployment:
        description: "Nombre del deployment de API (lcs-laravel-prod)"
        required: true
        type: string
      k8s-deployment-queue:
        description: "Nombre del deployment de queue (lcs-queue-prod)"
        required: true
        type: string
      k8s-deployment-scheduler:
        description: "Nombre del deployment de scheduler (lcs-scheduler-prod)"
        required: true
        type: string
      k8s-namespace:
        description: "Namespace K8s"
        required: true
        type: string
      docker-file:
        description: "Path al Dockerfile"
        required: false
        type: string
        default: "Dockerfile"

    secrets:
      kubeconfig:
        description: "Contenido del kubeconfig del cluster"
        required: true
      discord_webhook_url:
        description: "Webhook de Discord para notificaciones"
        required: false
      discord_username:
        description: "Username del bot en Discord"
        required: false

jobs:
  build:
    name: Build & Push imagen
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag de imagen
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.docker-file }}
          platforms: linux/amd64
          push: true
          # Sin attestation manifest (SLSA provenance) — ahorra un push extra y
          # simplifica el índice de la imagen.
          provenance: false
          tags: |
            ${{ inputs.image-name }}:${{ steps.meta.outputs.tag }}
            ${{ inputs.image-name }}:latest
          # Doble cache: GHA (rápido pero se evicta a 7 días / 10 GB y por rama)
          # + registry (durable, sobrevive a la evicción y sirve a un runner frío).
          # Con esto un deploy normal NO recompila pdo_mysql/gd/redis ni reinstala composer.
          cache-from: |
            type=gha
            type=registry,ref=${{ inputs.image-name }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ inputs.image-name }}:buildcache,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Notificar error de build a Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          DISCORD_USER: ${{ secrets.discord_username }}
        run: |
          set +e
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          BOT="${DISCORD_USER:-LCS Deploy}"
          curl -s -X POST "$DISCORD_WEBHOOK" --max-time 10 \
            -H "Content-Type: application/json" \
            --data-raw "{\"username\":\"$BOT\",\"content\":\"❌ Build fallido — \`${{ github.repository }}\` rama \`${{ github.ref_name }}\`\\nCommit: \`${{ github.sha }}\`\\nAutor: ${{ github.actor }}\"}"

  deploy:
    name: Deploy a K8s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout (manifiestos K8s)
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.kubeconfig }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # ── Migraciones ANTES del deploy ───────────────────────────────────────
      - name: Eliminar job de migración anterior (si existe)
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} delete job \
            lcs-migrate-${{ github.sha }} --ignore-not-found

      - name: Ejecutar migraciones
        id: migration
        run: |
          sed "s/__SHA__/${{ github.sha }}/g" k8s/05-job-migrate.yaml \
            | kubectl apply -f -

          JOB="lcs-migrate-${{ github.sha }}"
          NS="${{ inputs.k8s-namespace }}"

          # `kubectl wait --for=condition=complete` nunca se entera si el Job
          # pasa a `Failed` (backoffLimit: 0, sin reintentos) — se queda
          # esperando los 180s completos y reporta "timeout" aunque el error
          # real haya pasado en el segundo 1. Se hace polling manual para
          # salir apenas se conozca el resultado y volcar el log del pod al
          # output del step en ambos casos (éxito y falla), antes de que
          # ttlSecondsAfterFinished (300s) borre el Job.
          for i in $(seq 1 36); do
            SUCCEEDED=$(kubectl -n "$NS" get job "$JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null)
            FAILED=$(kubectl -n "$NS" get job "$JOB" -o jsonpath='{.status.failed}' 2>/dev/null)

            if [ "$SUCCEEDED" = "1" ]; then
              echo "Migración completada."
              kubectl -n "$NS" logs "job/$JOB" --all-containers
              exit 0
            fi

            if [ "$FAILED" = "1" ]; then
              echo "::error::Migración falló — log del Job:"
              kubectl -n "$NS" logs "job/$JOB" --all-containers
              exit 1
            fi

            sleep 5
          done

          echo "::error::Timeout real (180s) esperando la migración — log del Job:"
          kubectl -n "$NS" logs "job/$JOB" --all-containers || true
          exit 1

      - name: Notificar error de migración a Discord
        if: failure() && steps.migration.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          DISCORD_USER: ${{ secrets.discord_username }}
        run: |
          set +e
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          BOT="${DISCORD_USER:-LCS Deploy}"
          curl -s -X POST "$DISCORD_WEBHOOK" --max-time 10 \
            -H "Content-Type: application/json" \
            --data-raw "{\"username\":\"$BOT\",\"content\":\"⚠️ Migracion fallida — deploy cancelado\\n\`${{ github.repository }}\` commit \`${{ github.sha }}\`\\nEl pod anterior sigue corriendo sin cambios.\"}"

      # ── Deploy API ─────────────────────────────────────────────────────────
      - name: Deploy API (${{ inputs.k8s-deployment }})
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} set image deployment/${{ inputs.k8s-deployment }} \
            app=${{ inputs.image-name }}:${{ github.sha }}

      - name: Verificar rollout API
        id: rollout-api
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} rollout status \
            deployment/${{ inputs.k8s-deployment }} --timeout=120s

      - name: Notificar error de deploy API a Discord
        if: failure() && steps.rollout-api.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          DISCORD_USER: ${{ secrets.discord_username }}
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} rollout undo \
            deployment/${{ inputs.k8s-deployment }}
          set +e
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          BOT="${DISCORD_USER:-LCS Deploy}"
          curl -s -X POST "$DISCORD_WEBHOOK" --max-time 10 \
            -H "Content-Type: application/json" \
            --data-raw "{\"username\":\"$BOT\",\"content\":\"❌ Deploy API fallido — rollback ejecutado\\n\`${{ inputs.k8s-deployment }}\` en \`${{ inputs.k8s-namespace }}\`\\nCommit: \`${{ github.sha }}\`\"}"

      # ── Deploy Queue ───────────────────────────────────────────────────────
      - name: Deploy Queue (${{ inputs.k8s-deployment-queue }})
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} set image deployment/${{ inputs.k8s-deployment-queue }} \
            queue=${{ inputs.image-name }}:${{ github.sha }}

      - name: Verificar rollout Queue
        id: rollout-queue
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} rollout status \
            deployment/${{ inputs.k8s-deployment-queue }} --timeout=120s

      - name: Notificar error de deploy Queue a Discord
        if: failure() && steps.rollout-queue.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          DISCORD_USER: ${{ secrets.discord_username }}
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} rollout undo \
            deployment/${{ inputs.k8s-deployment-queue }}
          set +e
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          BOT="${DISCORD_USER:-LCS Deploy}"
          curl -s -X POST "$DISCORD_WEBHOOK" --max-time 10 \
            -H "Content-Type: application/json" \
            --data-raw "{\"username\":\"$BOT\",\"content\":\"❌ Deploy Queue fallido — rollback ejecutado\\n\`${{ inputs.k8s-deployment-queue }}\`\\nCommit: \`${{ github.sha }}\`\"}"

      # ── Deploy Scheduler ───────────────────────────────────────────────────
      - name: Deploy Scheduler (${{ inputs.k8s-deployment-scheduler }})
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} set image deployment/${{ inputs.k8s-deployment-scheduler }} \
            scheduler=${{ inputs.image-name }}:${{ github.sha }}

      - name: Verificar rollout Scheduler
        id: rollout-scheduler
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} rollout status \
            deployment/${{ inputs.k8s-deployment-scheduler }} --timeout=120s

      - name: Notificar error de deploy Scheduler a Discord
        if: failure() && steps.rollout-scheduler.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          DISCORD_USER: ${{ secrets.discord_username }}
        run: |
          kubectl -n ${{ inputs.k8s-namespace }} rollout undo \
            deployment/${{ inputs.k8s-deployment-scheduler }}
          set +e
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          BOT="${DISCORD_USER:-LCS Deploy}"
          curl -s -X POST "$DISCORD_WEBHOOK" --max-time 10 \
            -H "Content-Type: application/json" \
            --data-raw "{\"username\":\"$BOT\",\"content\":\"❌ Deploy Scheduler fallido — rollback ejecutado\\n\`${{ inputs.k8s-deployment-scheduler }}\`\\nCommit: \`${{ github.sha }}\`\"}"

      # ── Éxito total ────────────────────────────────────────────────────────
      - name: Notificar éxito a Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord_webhook_url }}
          DISCORD_USER: ${{ secrets.discord_username }}
        run: |
          set +e
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          BOT="${DISCORD_USER:-LCS Deploy}"
          curl -s -X POST "$DISCORD_WEBHOOK" --max-time 10 \
            -H "Content-Type: application/json" \
            --data-raw "{
              \"username\": \"$BOT\",
              \"embeds\": [{
                \"title\": \"✅ Deploy exitoso — ${{ github.repository }}\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Rama\",   \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                  {\"name\": \"Autor\",  \"value\": \"${{ github.actor }}\",         \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\",       \"inline\": false}
                ]
              }]
            }"
