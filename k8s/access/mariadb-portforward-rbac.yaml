# Aplicar una sola vez, manualmente — NO forma parte del deploy automático de CI/CD.
# ServiceAccount con permisos mínimos para el servicio systemd de port-forward
# que usa Navicat/DBeaver para conectarse a la BD desde el host local (VPS).
# Ver: Obsidian Vault "Template Estandar Backend" > Despliegue > Acceso a BD vía SSH + Port-Forward.md
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb-portforward
  namespace: lcs-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mariadb-portforward-role
  namespace: lcs-prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mariadb-portforward-binding
  namespace: lcs-prod
subjects:
  - kind: ServiceAccount
    name: mariadb-portforward
    namespace: lcs-prod
roleRef:
  kind: Role
  name: mariadb-portforward-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-portforward-token
  namespace: lcs-prod
  annotations:
    kubernetes.io/service-account.name: mariadb-portforward
type: kubernetes.io/service-account-token
