apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: lcs-prod
spec:
  serviceName: mariadb-service
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        # Root vive en su propio secret lcs-db-root — NO en lcs-env (que lo
        # consumen los pods públicos). Sólo aplica en la PRIMERA init del
        # volumen; en un cluster existente el root real ya está en mysql.user
        # (cambiarlo requiere ALTER USER — ver docs/RUNBOOK_BD_Y_SEGURIDAD.md).
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lcs-db-root
              key: DB_ROOT_PASSWORD
        - name: MARIADB_DATABASE
          value: db_siaw
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: lcs-env
              key: DB_SIAW_USERNAME
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lcs-env
              key: DB_SIAW_PASSWORD
        ports:
        - containerPort: 3306
        resources:
          requests: { memory: "256Mi", cpu: "250m", ephemeral-storage: "512Mi" }
          limits:   { memory: "768Mi", cpu: "500m", ephemeral-storage: "1Gi" }
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: init-sql
        configMap:
          name: mariadb-init
  volumeClaimTemplates:
  - metadata:
      name: mariadb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  namespace: lcs-prod
spec:
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
  clusterIP: None  # Headless — StatefulSet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
  namespace: lcs-prod
data:
  # OJO: /docker-entrypoint-initdb.d solo corre en la PRIMERA inicialización
  # (volumen `mariadb-data` vacío). En un cluster ya existente, agregar una
  # base acá NO la crea — de eso se encarga k8s/scripts/ensure-databases.php
  # desde el Job de migración (05-job-migrate.yaml), que es idempotente.
  # Este SQL solo cubre el bootstrap de un cluster nuevo.
  01_init_databases.sql: |
    CREATE DATABASE IF NOT EXISTS `db_lcs`
        CHARACTER SET utf8mb4
        COLLATE utf8mb4_unicode_ci;

    CREATE DATABASE IF NOT EXISTS `db_siaw`
        CHARACTER SET utf8mb4
        COLLATE utf8mb4_unicode_ci;

    CREATE DATABASE IF NOT EXISTS `db_sincro`
        CHARACTER SET utf8mb4
        COLLATE utf8mb4_unicode_ci;

    GRANT ALL PRIVILEGES ON `db_lcs`.*    TO 'sail'@'%';
    GRANT ALL PRIVILEGES ON `db_siaw`.*   TO 'sail'@'%';
    GRANT ALL PRIVILEGES ON `db_sincro`.* TO 'sail'@'%';

    FLUSH PRIVILEGES;
