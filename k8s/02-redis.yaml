apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lcs-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        # Con REDIS_PASSWORD seteado → exige auth; sin el secret → sin auth
        # (comportamiento actual). Ver docs/RUNBOOK_BD_Y_SEGURIDAD.md.
        command:
          - sh
          - -c
          - exec redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lcs-db-users
              key: REDIS_PASSWORD
              optional: true
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: lcs-prod
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
